{% extends "base.html" %}

{% block content %}
<div class="content-panel map-panel">
  <div class="section-header">
    <span class="icon">📍</span>
    <h2>避難所マップ</h2>
  </div>

  <div class="map-shell">
    <div id="shelterMap"></div>
  </div>
</div>

<div class="content-panel weather-panel">
  <div class="weather-header">
    <div class="section-header" style="margin: 0;">
      <span class="icon">☁️</span>
        <h2>青森市 気象警報・注意報</h2>

  <div id="weatherContent" class="weather-content">
    <p>読み込み中...</p>
  </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const map = L.map('shelterMap').setView([40.8244, 140.7400], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                updateWeatherContent(data);
            })
            .catch(error => {
                console.error('気象情報の更新に失敗しました:', error);
                const weatherContent = document.getElementById('weatherContent');
                weatherContent.innerHTML = '<p>気象情報の取得に失敗しました</p>';
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = '<p>気象情報の取得に失敗しました</p>';
            return;
        }

        let warningsHtml = '<p>現在、警報・注意報は発表されていません</p>';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = '<ul class="weather-list">';
            data.warnings.forEach(warning => {
                warningsHtml += `<li><span class="weather-icon">✓</span>${warning.name}（${warning.status}）</li>`;
            });
            warningsHtml += '</ul>';
        }

        weatherContent.innerHTML = `
            <p><strong>📍</strong> ${data.area_name || '青森市'}</p>
            ${warningsHtml}
            <p class="weather-note">🕒 最終確認: <span id="lastFetchTime">${data.last_fetch_time || '更新中...'}</span></p>
            <p class="weather-note">📡 気象庁最終発表: ${data.report_time || '不明'}</p>
        `;
    }

    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
